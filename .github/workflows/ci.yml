name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    name: Package VSIX
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package:vsix
      - run: npm run package:contents > package-contents.txt
      - run: sha256sum spice-*.vsix > spice-vsix.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: spice-vsix-${{ github.sha }}
          path: |
            spice-*.vsix
            spice-vsix.sha256
            package-contents.txt
          if-no-files-found: error
