name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-boundary:
    name: Public boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: scripts/check-public-boundary.sh --staged
      - run: scripts/check-public-boundary.sh --history

  check:
    name: Check on Node ${{ matrix.node }}
    needs: public-boundary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    name: Package VSIX
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:vsix
      - run: npm run package:contents > package-contents.txt
      - run: sha256sum spice-*.vsix > spice-vsix.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spice-vsix-${{ github.sha }}
          path: |
            spice-*.vsix
            spice-vsix.sha256
            package-contents.txt
          if-no-files-found: error
